# Defines PHP related variables.
variables:
  PRIMARY_PHP: "8.5-ubuntu"
  NEXT_PHP_MAJOR: "8.6-ubuntu"
  MINIMUM_PHP: "8.5-ubuntu"

# Used in matrix jobs.
#  parallel:
#    matrix:
#      - _TARGET_PHP: !reference [.php_versions]
.php_versions:
  [8.5-ubuntu, 8.6-ubuntu]

'🎭️ Playwright':
  <<: [ *with-composer, *default-job-settings ]
  retry: 1
  variables:
    KUBERNETES_CPU_REQUEST: "16"
    YARN_ENABLE_GLOBAL_CACHE: false
    YARN_ENABLE_MIRROR: false
  services:
    - <<: *with-database
  script:
    - export DRUPAL_TEST_DB_URL=$SIMPLETEST_DB
    - export DRUPAL_TEST_BASE_URL=$SIMPLETEST_BASE_URL
    - export DRUPAL_PLAYWRIGHT_OUTPUT=../playwright_output
    - chown -R www-data:www-data ./sites /var/www
    - cd core
    - corepack enable
    - yarn install
    - echo -e "Node version $(node --version)\nYarn version $(yarn --version)"
    - yarn playwright install --with-deps chromium-headless-shell
    - yarn run test:playwright --max-failures 3
  artifacts:
    when: always
    expire_in: 6 mos
    reports:
      junit: ./playwright_output/results.xml
    paths:
      - ./playwright_output
  cache:
    key:
      files:
        - ./core/package.json
        - ./core/yarn.lock
    paths:
      - ./core/.yarn/cache
    policy: pull
