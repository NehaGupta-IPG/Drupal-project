basic_auth_test.state.modify:
  path: '/basic_auth_test/state/modify'
  defaults:
    _controller: 'basic_auth_test.controller:modifyState'
  options:
    _auth:
      - basic_auth
  requirements:
    _user_is_logged_in: 'TRUE'

basic_auth_test.state.read:
  path: '/basic_auth_test/state/read'
  defaults:
    _controller: 'basic_auth_test.controller:readState'
  requirements:
    _access: 'TRUE'
