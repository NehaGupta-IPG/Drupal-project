# Schema for the configuration files of the Comment module.
comment.settings:
  type: config_object
  label: 'Comment settings'
  constraints:
    FullyValidatable: ~
  mapping:
    log_ip_addresses:
      type: boolean
      label: 'Whether to log IP addresses with comments or not.'

field.formatter.settings.comment_default:
  type: mapping
  label: 'Comment display format settings'
  mapping:
    view_mode:
      type: string
      label: 'The comment entity view mode to be used in this formatter'
    pager_id:
      type: integer
      label: 'Pager ID'
    # This setting is deprecated in drupal:11.5.0 and is removed from
    # drupal:13.0.0. Only entity access control will be available, and the
    # field--comment.html.twig template overrides should be adapted.
    # @see https://www.drupal.org/node/3180183
    use_entity_access_control:
      type: boolean
      label: 'Use entity access control'
      # Defaults to FALSE.
      # @see \Drupal\comment\Plugin\Field\FieldFormatter\CommentDefaultFormatter::defaultSettings()
      requiredKey: false
      deprecated: "The 'use_entity_access_control' config schema is deprecated in drupal:11.5.0 and is removed from drupal:13.0.0. Only entity access control will be available, and the field--comment.html.twig template overrides should be adapted. See https://www.drupal.org/node/3180183"

field.widget.settings.comment_default:
  type: mapping
  label: 'Comment display format settings'

comment.type.*:
  type: config_entity
  label: 'Comment type settings'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    target_entity_type_id:
      type: string
      label: 'Target Entity Type ID'
    description:
      type: text
      label: 'Description'

field.storage_settings.comment:
  type: mapping
  label: 'Comment settings'
  mapping:
    comment_type:
      label: 'Comment type'
      type: string

field.value.comment:
  type: mapping
  label: 'Default value'
  mapping:
    status:
      type: integer
      label: 'Comment status'
    cid:
      type: integer
      label: 'Last comment ID'
    last_comment_timestamp:
      type: integer
      label: 'Last comment timestamp'
    last_comment_name:
      type: integer
      label: 'Last comment name'
    last_comment_uid:
      type: integer
      label: 'Last comment user ID'
    comment_count:
      type: integer
      label: 'Number of comments'

field.field_settings.comment:
  type: mapping
  label: 'Comment settings'
  mapping:
    default_mode:
      type: integer
      label: 'Threading'
    per_page:
      type: integer
      label: 'Comments per page'
    anonymous:
      type: integer
      label: 'Mode'
    form_location:
      type: boolean
      label: 'Allow comment title'
    preview:
      type: integer
      label: 'Preview comment'

field.formatter.settings.comment_permalink:
  type: field.formatter.settings.string
