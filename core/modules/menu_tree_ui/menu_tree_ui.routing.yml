    _entity_access: 'menu.update'
  options:
    _admin_route: true
    parameters:
      menu:
        type: entity:menu

menu_tree_ui.move:
  path: '/admin/structure/menu-tree-ui/{menu}/move'
  defaults:
    _controller: '\Drupal\menu_tree_ui\Controller\MenuTreeController::move'
  methods: [POST]
  requirements:
    _entity_access: 'menu.update'
    _csrf_request_header_token: 'TRUE'
  options:
    _admin_route: true
    no_cache: TRUE
    parameters:
      menu:
        type: entity:menu

