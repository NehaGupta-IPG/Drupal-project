# Schema for the configuration files of the Navigation module.

navigation.settings:
  type: config_object
  label: 'Navigation settings'
  constraints:
    FullyValidatable: ~
  mapping:
    logo:
      type: mapping
      label: 'Logo settings'
      mapping:
        provider:
          type: string
          label: 'Select Navigation logo handling'
          constraints:
            Choice:
              choices:
                - default
                - hide
                - custom
        path:
          type: string
          label: 'Path'
          constraints:
            NotNull: [ ]
        max:
          type: mapping
          label: 'Logo maximum settings'
          mapping:
            filesize:
              type: integer
              label: 'Maximum file sizes (bytes)'
              constraints:
                NotNull: [ ]
                PositiveOrZero: ~
            height:
              type: integer
              label: 'Logo expected height'
              constraints:
                NotNull: [ ]
                PositiveOrZero: ~
            width:
              type: integer
              label: 'Logo expected width'
              constraints:
                NotNull: [ ]
                PositiveOrZero: ~
          constraints:
            ValidKeys:
              allowedKeys: '<infer>'
      constraints:
        ValidKeys:
          allowedKeys: '<infer>'

navigation.block_layout:
  type: config_object
  mapping:
    sections:
      type: sequence
      sequence:
        type: navigation.block_layout.section

navigation.block_layout.section:
  type: mapping
  label: 'Layout section'
  mapping:
    layout_id:
      type: string
      label: 'Layout ID'
      constraints:
        PluginExists:
          manager: plugin.manager.core.layout
          interface: '\Drupal\Core\Layout\LayoutInterface'
    layout_settings:
      type: layout_plugin.settings.[%parent.layout_id]
      label: 'Layout settings'
    components:
      type: sequence
      label: 'Components'
      sequence:
        type: navigation.block_layout.component
    third_party_settings:
      type: sequence
      label: 'Third party settings'
      sequence:
        type: '[%parent.%parent.%type].third_party.[%key]'

navigation.block_layout.component:
  type: mapping
  label: 'Component'
  mapping:
    uuid:
      type: uuid
      label: 'UUID'
    region:
      type: string
      label: 'Region'
    configuration:
      type: block.settings.[id]
    weight:
      type: weight
      label: 'Weight'
    additional:
      type: ignore
      label: 'Additional data'

block.settings.navigation_menu:*:
  type: block_settings
  label: 'Menu block'
  mapping:
    level:
      type: integer
      label: 'Starting level'
    depth:
      type: integer
      label: 'Maximum number of levels'

block.settings.navigation_link:
  type: block_settings
  label: 'Link block'
  mapping:
    title:
      type: label
      label: 'Link title'
    uri:
      type: string
      label: 'URL'
    icon_class:
      type: string
      label: 'Icon CSS Class'
      constraints:
        Regex:
          pattern: '/^[a-z0-9_-]+$/'
          message: "The %value icon CSS class is not valid."
  constraints:
    FullyValidatable: ~
