media.update_metadata:
  path: '/media/{media}/update-metadata'
  defaults:
    _controller: '\Drupal\media\Controller\UpdateMetadataController::updateMetadata'
  requirements:
    _entity_access: 'media.update'
    _csrf_token: 'TRUE'

media.update_metadata_confirm:
  path: '/media/{media}/update-metadata/confirm'
  defaults:
    _form: '\Drupal\media\Form\UpdateMetadataConfirmForm'
    _title: 'Refresh media item'
  requirements:
    _entity_access: 'media.update'
  options:
    _admin_route: TRUE
    parameters:
      media:
        type: entity:media

media.oembed_iframe:
  path: '/media/oembed'
  defaults:
    _controller: '\Drupal\media\Controller\OEmbedIframeController::render'
  requirements:
    _permission: 'view media'

media.settings:
  path: '/admin/config/media/media-settings'
  defaults:
    _form: '\Drupal\media\Form\MediaSettingsForm'
    _title: 'Media settings'
  requirements:
    _permission: 'administer media'

media.filter.preview:
  path: '/media/{filter_format}/preview'
  defaults:
    _controller: '\Drupal\media\Controller\MediaFilterController::preview'
  methods: [GET]
  requirements:
    _entity_access: 'filter_format.use'
    _custom_access: '\Drupal\media\Controller\MediaFilterController::formatUsesMediaEmbedFilter'
