$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card
status: experimental
variants:
  horizontal:
    title: Horizontal
  vertical:
    title: Vertical
props:
  type: object
  required:
    - header
  properties:
    header:
      type: string
      title: Header
      description: The card header
      examples:
        - I am a header!
    slogan:
      type: string
      title: Slogan
      description: A pithy and clever, but optional, slogan.
    author_and_time:
      type: object
      properties:
        author:
          type: string
          title: Author
          description: A person's name, optional.
        time:
          type: string
          title: Time
          description: A date and time.
      required:
        - time
    classes:
      type: array
      title: Optional extra CSS classes.
      items:
        type: string
slots:
  card_body:
    title: Body
    description: The contents of the card.
    examples:
      - <p>Foo is <strong>NOT</strong> bar.</p>
