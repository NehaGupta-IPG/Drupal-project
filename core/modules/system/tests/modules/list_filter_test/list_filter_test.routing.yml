list_filter_test:
  path: '/list-filter/{test_case}'
  defaults:
    _title: 'Controller test for list filter'
    _controller: '\Drupal\list_filter_test\Controller\ListFilterTestController'
  requirements:
    _permission: 'access content'

list_filter_test_multiple:
  path: '/list-filter/multiple-filters-on-page'
  defaults:
    _title: 'Controller test for list filter'
    _controller: '\Drupal\list_filter_test\Controller\ListFilterTestController::multipleFiltersOnPage'
  requirements:
    _permission: 'access content'