accessibility_test.default:
  path: '/accessibility-test'
  defaults:
    _title: 'Accessibility test'
    _controller: '\Drupal\accessibility_test\Controller\AccessibilityTestController::page'
  options:
    no_cache: TRUE
  requirements:
    _access: 'TRUE'

# Same controller with restricted access for testing $admin argument of
# AccessibilityTestBase::testPages.
accessibility_test.admin:
  path: '/admin/accessibility-test'
  defaults:
    _title: 'Accessibility test'
    _controller: '\Drupal\accessibility_test\Controller\AccessibilityTestController::page'
  options:
    no_cache: TRUE
  requirements:
    _permission: 'administer site configuration'
