services:
  _defaults:
    autowire: true

  # This registers a service in the Hook namespace, used to test that hook
  # implementations in Hook-namespaced classes are not invoked more than once.
  Drupal\hook_collector_hook_attribute\Hook\HookRegisteredService: ~

  # This service ID is purposely not a FQCN, to test that look up of existing
  # hook services in HookCollectorPass works correctly.
  hook_collector_hook_attribute.hook_registered_service:
    class: 'Drupal\hook_collector_hook_attribute\Hook\HookRegisteredService'

  Drupal\hook_collector_hook_attribute\ServiceWithHook: ~

  Drupal\hook_collector_hook_attribute\AnotherServiceWithHook: ~

  # Provide a service definition for a class in core namespace, so it can hook
  # discovery can run on it.
  Drupal\Core\Test\TestHookService: ~

  Drupal\hook_collector_hook_attribute\ServiceWithHookDecorator:
    class: Drupal\hook_collector_hook_attribute\ServiceWithHookDecorator
    public: false
    decorates: Drupal\hook_collector_hook_attribute\ServiceWithHook
