# Tests CSRF request header token protection.
csrf_test.protected:
  path: csrf/protected
  methods: ['POST']
  defaults:
    _controller: '\Drupal\csrf_test\Controller\TestController::testMethod'
  requirements:
    _csrf_request_header_token: 'TRUE'
csrf_test.protected_read_only:
  path: csrf/protected/read-only
  methods: ['GET']
  defaults:
    _controller: '\Drupal\csrf_test\Controller\TestController::testMethod'
  requirements:
    _access: 'TRUE'
    _csrf_request_header_token: 'TRUE'
csrf_test.route_with_csrf_token:
  path: csrf/protected/route
  defaults:
    _controller: '\Drupal\csrf_test\Controller\TestController::testMethod'
  requirements:
    _permission: 'administer site configuration'
    _csrf_token: 'TRUE'
csrf_test.unprotected_config_write:
  path: csrf/unprotected-config-write
  methods: ['GET']
  defaults:
    _controller: '\Drupal\csrf_test\Controller\TestController::writeConfig'
  requirements:
    _access: 'TRUE'
csrf_test.unprotected_entity_write:
  path: csrf/unprotected-entity-write
  methods: ['GET']
  defaults:
    _controller: '\Drupal\csrf_test\Controller\TestController::writeEntity'
  requirements:
    _access: 'TRUE'
