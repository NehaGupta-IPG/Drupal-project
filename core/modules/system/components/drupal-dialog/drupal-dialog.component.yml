$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Drupal Dialog
description: A web component wrapping a dialog intended to be rendered for display using HTMX.
status: experimental
group: Dialog

variants:
  default:
    title: Default
    description: A standard, non-modal dialog.
  modal:
    title: Modal
    description: A blocking, or modal, dialog.
  off_canvas:
    title: Off-canvas
    description: An interactive element that is inserted at the side, rather than above the document.

props:
  type: object
  required:
    - id
  properties:
    id:
      title: ID attribute.
      type: string
    title:
      title: Title
      type: string
      description: Label for the dialog title bar
    position:
      type: string
      title: Dialog position
      description: Only used by core of off-canvas which is currently always set to 'side'.
      enum:
        - default
        - top
        - bottom
        - side
      default: default

slots:
  content:
    title: Content
    description: The content provided for the dialog

libraryOverrides:
  dependencies:
    - core/drupal.htmx
  css:
    component:
      drupal-dialog.css: {}
      off-canvas/reset.css: { }
      off-canvas/base.css: { }
      off-canvas/utility.css: { }
      off-canvas/button.css: { }
      off-canvas/drupal.css: { }
      off-canvas/form.css: { }
      off-canvas/table.css: { }
      off-canvas/details.css: { }
      off-canvas/messages.css: { }
      off-canvas/tabledrag.css: { }
      off-canvas/throbber.css: { }
      off-canvas/dropbutton.css: { }
      off-canvas/titlebar.css: { }
      off-canvas/wrapper.css: { }
  js:
    drupal-dialog.js: {}
