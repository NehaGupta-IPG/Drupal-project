services:
  php:
    image: tugboatqa/php:8.5-apache
    default: true
    commands:
      # The init command is baked into the base preview image and is inherited
      # by every preview without re-running.
      init:
        - a2enmod headers rewrite
        - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
        - echo "memory_limit = 2G" >> /usr/local/etc/php/conf.d/my-php.ini
      # The build command runs for every preview, so Drupal is freshly installed
      # from the previewed branch on each build using core's built-in CLI
      # installer (which installs into SQLite). This avoids any dependency on
      # Drush or an external database service.
      build:
        - composer install --optimize-autoloader
        # Child previews clone the base preview's filesystem, which includes the
        # settings.php and SQLite database generated by the base build. Drupal
        # makes sites/default read-only after installing, so make it writable
        # and remove the prior install to force a clean reinstall.
        - chmod -f u+w "${DOCROOT}/sites/default" || true
        - rm -rf "${DOCROOT}/sites/default/files" "${DOCROOT}/sites/default/settings.php"
        - vendor/bin/dr install standard --site-name="Drupal core preview" --password=admin
        # Let the web server (www-data) read and write the files directory and
        # the SQLite database. Run last so this is the final permission state.
        - chgrp -R www-data "${DOCROOT}/sites/default/files"
        - find "${DOCROOT}/sites/default/files" -type d -exec chmod 2775 {} \;
        - find "${DOCROOT}/sites/default/files" -type f -exec chmod 0664 {} \;
