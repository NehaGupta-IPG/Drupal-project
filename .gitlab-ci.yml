workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

variables:
  FF_USE_FASTZIP: 1
  _CONFIG_DOCKERHUB_ROOT: "registry.gitlab.com/drupal-infrastructure/drupalci/drupalci-environments"
  CACHE_TARGET: "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}${CI_COMMIT_BRANCH}"
  CORE_GITLAB_PROJECT_ID: 59858
  # Let composer know what self.version means.
  COMPOSER_ROOT_VERSION: "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}${CI_COMMIT_BRANCH}-dev"
  COMPOSER_ALLOW_SUPERUSER: 1
  GIT_DEPTH: "50"
  _TARGET_PHP: "8.4-ubuntu"
  PHPUNIT_FAIL_ON_PHPUNIT_DEPRECATION: false

stages:
  - Rector

default:
  interruptible: true
  image:
    name: $_CONFIG_DOCKERHUB_ROOT/php-$_TARGET_PHP-apache:production


'Rector test annotations to attributes':
  stage: Rector
  variables:
    KUBERNETES_CPU_REQUEST: ""
  script:
    - composer install --optimize-autoloader --ansi
    - composer run-script drupal-phpunit-upgrade-check
    - composer require --dev rector/rector palantirnet/drupal-rector --ansi
    - git config --global user.name 'rector-bot'
    - git config --global user.email 'rector-bot@rector-bot.com'
    - mkdir rector-changes
    - git checkout -- .
    - vendor/bin/rector --version
    - vendor/bin/phpcbf --version
    - vendor/bin/rector || true
    - vendor/bin/phpcbf --filter=GitModified --standard=Drupal,SlevomatCodingStandard --sniffs=SlevomatCodingStandard.Namespaces.AlphabeticallySortedUses,PSR2.Namespaces.UseDeclaration,PSR2.Namespaces.NamespaceDeclaration,Drupal.Classes.UnusedUseStatement,Drupal.Commenting.DocComment,Drupal.WhiteSpace.ScopeIndent,Generic.PHP.UpperCaseConstant,Squiz.WhiteSpace.SuperfluousWhitespace,Squiz.WhiteSpace.FunctionSpacing,Drupal.Classes.FullyQualifiedNamespace,Drupal.Files.EndFileNewline --ignore=core/tests/Drupal/Tests/Component/Annotation/Doctrine/* core
  after_script:
    - git diff >rector-changes/rector-changes.patch
  artifacts:
    when: always
    paths:
      - rector-changes
